openapi: 3.0.3

info:
  title: Customer API
  description: Customer Management API
  version: 1.0.0

servers:
  - url: http://localhost:3001

paths:

  /health:
    get:
      summary: Health Check

      responses:
        '200':
          description: API is healthy


  /customers:

    post:
      tags:
        - Customers
      operationId: createCustomer
      summary: Create Customer

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'

      responses:

        '201':
          description: Customer created successfully

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Customer'

        '400':
          description: Invalid request

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Customer already exists

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get: 
      tags:
        - Customers
      operationId: getCustomers
      summary: Get All Customers

      responses:

        '200':
          description: List of customers

          content:
            application/json:

              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Customer'

        '500':
          description: Internal server error

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/{id}:
    
    get:
      operationId: getCustomerById
      summary: Get Customer by ID
      tags:
        - Customers

      parameters:
        - $ref: '#/components/parameters/CustomerId'

      responses:

        '200':
          description: Customer details

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Customer'

        '404':
          description: Customer not found

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customers
      operationId: updateCustomer
      summary: Update Customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      operationId: patchCustomer  
      summary: Partially Update Customer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteCustomer
      summary: Delete Customer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted successfully
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                

components:
  schemas:
    Customer:
      type: object

      required:
        - id
        - firstName
        - lastName
        - email
        - createdAt
        - updatedAt

      properties:

        id:
          type: string

        firstName:
          type: string

        lastName:
          type: string

        email:
          type: string
          format: email

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object

      required:
        - firstName
        - lastName
        - email

      properties:

        firstName:
          type: string

        lastName:
          type: string

        email:
          type: string

    ErrorResponse:
      type: object

      properties:

        message:
          type: string
    
    UpdateCustomerRequest:
      type: object

      properties:

        firstName:
          type: string

        lastName:
          type: string

        email:
          type: string

  parameters:

    CustomerId:

      name: id

      in: path

      required: true

      schema:
        type: string

      description: Customer identifier