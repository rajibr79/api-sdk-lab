services:
  postgres:
    image: postgres:17

    container_name: customer-postgres

    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
    - "5433:5432"

    volumes:
       - postgres-data:/var/lib/postgresql/data
       - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  
  customer-api:
    build: .
    container_name: customer_api

    ports:
      - "3001:3001"
    depends_on:
       postgres:
          condition: service_healthy

    
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customerdb
      DB_USER: admin
      DB_PASSWORD: admin123

volumes:
  postgres-data: